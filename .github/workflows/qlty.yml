name: Qlty

# Pull requests are checked here instead of being built: the Windows and Linux
# builds are paid runner minutes, and this job is a few seconds on Linux.
# - `qlty check` lints only what the PR changes (actionlint, zizmor, trufflehog, osv-scanner); only high issues fail
# - `qlty smells` reports duplication and complexity in the files the PR changed

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qlty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qlty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: qltysh/qlty-action/install@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2

      - name: Check
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: qlty check --upstream "origin/$BASE_REF" --fail-level high --no-upgrade-check

      # Comment mode in .qlty/qlty.toml: smells are reported, they do not fail the job.
      - name: Smells
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: qlty smells --no-snippets --no-upgrade-check --upstream "origin/$BASE_REF"
