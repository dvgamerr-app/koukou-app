name: Windows

# Builds the Windows app (MSI + NSIS installer + portable exe).
# - pushes to main: build and test only, no upload (pull requests are checked by qlty.yml, not built, to save paid runner minutes)
# - manual run: build and upload the installers as workflow artifacts
# - tag `v*`: build and publish a GitHub release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # dependencies are installed by bun (bun.lock)

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: bun install --frozen-lockfile

      # The version lives in three files and they drift silently.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag   = $env:REF_NAME -replace '^v', ''
          $conf  = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg   = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      - name: Type-check, lint the Rust code and build the hook
        shell: pwsh
        run: |
          npx tsc --noEmit
          cargo build --release -p koukou-hook
          cargo check --workspace --locked

      # `npm run pack` runs `tauri build` (which builds the front end and bundles
      # koukou-hook.exe) and copies the installers to release/.
      - name: Build and pack the installers
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: Koukou-Windows
          path: |
            release/Koukou-Windows-${{ steps.pack.outputs.version }}-setup.exe
            release/Koukou-Windows-${{ steps.pack.outputs.version }}.msi
            target/release/koukou.exe
            target/release/koukou-hook.exe
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          $v = $env:VERSION
          gh release create $env:REF_NAME `
            "release/Koukou-Windows-$v-setup.exe" `
            "release/Koukou-Windows-$v.msi" `
            --title "Koukou $v" `
            --notes "Koukou for Windows $v. The installers are not code-signed yet, so SmartScreen shows a warning: click **More info > Run anyway**."
